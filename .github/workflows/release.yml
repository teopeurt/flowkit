name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_pr:
    name: Changesets release PR
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has-changesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out FlowKit
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update the Changesets release pull request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run release:version
          commit-message: Version Packages
          pr-title: Version Packages

  publish:
    if: needs.release_pr.outputs.has_changesets == 'false'
    needs: release_pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out FlowKit
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up GitHub Packages authentication
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@naakwu'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate the registry-backed publish plan
        id: publish_plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run version:check
          bun run release:plan

          release_count="$(node -e "const plan = require('./.changeset/release-plan.json'); console.log(plan.plan.flat().length)")"
          if (( release_count > 0 )); then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release plan and package candidates
        if: steps.publish_plan.outputs.has_releases == 'true'
        run: |
          bun run release:validate
          bun run typecheck
          bun run test
          bun run build
          bun run pack:check

      - name: Check out FlowKit demo
        if: steps.publish_plan.outputs.has_releases == 'true'
        uses: actions/checkout@v7
        with:
          repository: teopeurt/flowkit-demo
          path: flowkit-demo

      - name: Install Chromium for the candidate stack gate
        if: steps.publish_plan.outputs.has_releases == 'true'
        run: |
          set -euo pipefail
          # scripts/test-demo-candidate.sh runs the demo's own `bun run stack:ci`, so the browser
          # must match the Playwright version pinned in the demo lockfile. A bare `bunx playwright`
          # resolves to the latest release and installs a browser build the demo's driver cannot find.
          playwright_version="$(node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const text = fs.readFileSync(path, "utf8");
            const versions = new Set(
              [...text.matchAll(/^\s*"[^"]*playwright":\s*\[\s*"(?:[^"/]+\/)?playwright@([^"]+)"/gm)].map((match) => match[1]),
            );
            if (versions.size !== 1) {
              const found = versions.size === 0 ? "none" : [...versions].sort().join(", ");
              console.error(`expected exactly one resolved playwright version in ${path}, found: ${found}`);
              process.exit(1);
            }
            process.stdout.write([...versions][0]);
          ' flowkit-demo/bun.lock)"
          if [[ -z "$playwright_version" ]]; then
            echo "could not derive the demo's locked playwright version from flowkit-demo/bun.lock" >&2
            exit 1
          fi
          echo "installing Chromium for playwright@${playwright_version} (demo lockfile pin)"
          bunx "playwright@${playwright_version}" install --with-deps chromium

      - name: Test the exact candidates in the demo
        if: steps.publish_plan.outputs.has_releases == 'true'
        run: |
          set -euo pipefail
          bun run version:check
          bun run build

          candidate_root="$(mktemp -d "$RUNNER_TEMP/flowkit-candidate.XXXXXX")"
          cleanup() { rm -rf "$candidate_root"; }
          trap cleanup EXIT

          packages=(auth consumer core notify tasks temporal definitions)
          demo_packages=(auth consumer core notify tasks temporal)
          declare -A candidate_tarball_by_package=()
          expected_version="$(node -e 'const fs = require("node:fs"); const names = ["auth", "consumer", "core", "definitions", "notify", "tasks", "temporal"]; const manifests = names.map((name) => JSON.parse(fs.readFileSync(`packages/${name}/package.json`, "utf8"))); const versions = new Set(manifests.map(({ version }) => version)); if (versions.size !== 1) throw new Error("candidate package versions are not lockstep"); process.stdout.write(manifests[0].version);')"
          for package in "${packages[@]}"; do
            mkdir -p "$candidate_root/$package"
            (cd "packages/$package" && bun pm pack --destination "$candidate_root/$package")
            tarball="$(find "$candidate_root/$package" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            if [[ -z "$tarball" ]]; then
              echo "no candidate tarball produced for $package" >&2
              exit 1
            fi
            candidate_version="$(node -e 'const fs = require("node:fs"); const cp = require("node:child_process"); const tarball = process.argv[1]; const manifest = JSON.parse(cp.execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" })); process.stdout.write(manifest.version);' "$tarball")"
            if [[ "$candidate_version" != "$expected_version" ]]; then
              echo "candidate $package is $candidate_version, expected $expected_version" >&2
              exit 1
            fi
            candidate_tarball_by_package["$package"]="$(realpath "$tarball")"
          done
          # All seven lockstep candidates are packed and version-checked above. The demo pins only
          # the six pre-definitions packages, so only those are rewritten into the disposable copy.
          demo_candidate_tarballs=()
          for package in "${demo_packages[@]}"; do
            demo_candidate_tarballs+=("${candidate_tarball_by_package[$package]}")
          done
          bash scripts/test-demo-candidate.sh \
            "$GITHUB_WORKSPACE/flowkit-demo" \
            "${demo_candidate_tarballs[@]}"

      - name: Publish validated candidates
        if: steps.publish_plan.outputs.has_releases == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:publish
