name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_pr:
    name: Changesets release PR
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out FlowKit
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update the Changesets release pull request
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run release:version
          commit-message: Version Packages
          pr-title: Version Packages

  publish:
    if: needs.release_pr.outputs.has_changesets == 'false'
    needs: release_pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out FlowKit
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up GitHub Packages authentication
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@naakwu'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the registry-backed publish plan
        id: publish_plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run version:check
          bun run release:plan

          release_count="$(node -e "const plan = require('./.changeset/release-plan.json'); console.log(plan.plan.flat().length)")"
          if (( release_count > 0 )); then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release plan and package candidates
        if: steps.publish_plan.outputs.has_releases == 'true'
        run: |
          bun run release:validate
          bun run typecheck
          bun run test
          bun run build
          bun run pack:check

      - name: Pack durable demo candidates
        if: steps.publish_plan.outputs.has_releases == 'true'
        run: |
          mkdir -p candidate-tarballs
          for package in auth consumer core notify tasks temporal; do
            mkdir -p "candidate-tarballs/$package"
            (cd "packages/$package" && bun pm pack \
              --destination "$GITHUB_WORKSPACE/candidate-tarballs/$package")
          done

      - name: Check out FlowKit demo
        if: steps.publish_plan.outputs.has_releases == 'true'
        uses: actions/checkout@v4
        with:
          repository: naakwu/flowkit-demo
          path: flowkit-demo
          token: ${{ secrets.FLOWKIT_DEMO_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Test the exact candidates in the demo
        if: steps.publish_plan.outputs.has_releases == 'true'
        run: |
          candidate_tarballs=()
          for package in auth consumer core notify tasks temporal; do
            candidate_tarballs+=("$(find "$GITHUB_WORKSPACE/candidate-tarballs/$package" -maxdepth 1 -name '*.tgz' -print -quit)")
          done
          bash scripts/test-demo-candidate.sh \
            "$GITHUB_WORKSPACE/flowkit-demo" \
            "${candidate_tarballs[@]}"

      - name: Publish validated candidates
        if: steps.publish_plan.outputs.has_releases == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release:publish
