name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FlowKit
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check lockstep versions
        run: bun run version:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Test demo candidate isolation
        run: bash scripts/test-demo-candidate.test.sh

      - name: Test release workflow contract
        run: bash scripts/test-release-workflow.test.sh

      - name: Check packed packages
        run: bun run pack:check
